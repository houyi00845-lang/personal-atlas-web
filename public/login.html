<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#110c12"><title>个人知识库 · 登录</title><link rel="stylesheet" href="/auth.css"></head>
<body><main class="auth-card"><a class="wordmark" href="/">PERSONAL ATLAS<span>个人知识库</span></a><span class="eyebrow">A SPACE FOR YOUR OWN STORY</span><h1 id="page-title">回到你的知识空间</h1><p id="page-intro">输入访问密码，继续阅读你的经历与成长。</p>
<form id="auth-form"><div id="setup-key-row" hidden><label for="setup-key">初始化密钥</label><input id="setup-key" name="key" type="password" autocomplete="off" maxlength="512"><p class="hint">使用你在托管后台设置的初始化密钥。</p></div><label id="password-label" for="password">访问密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><div id="confirmation-row" hidden><label for="confirmation">再次输入密码</label><input id="confirmation" name="confirmation" type="password" autocomplete="new-password" maxlength="256"><p class="hint">至少 14 个字符，建议使用便于记忆的长口令。</p></div><button id="submit" type="submit">进入知识库 <span>→</span></button><p id="message" role="status" aria-live="polite"></p></form><a id="setup-link" class="subtle" href="/setup" hidden>首次使用，初始化网站</a><p class="privacy-note">资料将在登录验证通过后读取。</p></main><footer class="auth-footer">记录经历，也看见变化。</footer><script src="/auth.js"></script></body></html>

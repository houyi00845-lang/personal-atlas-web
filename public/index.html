<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>个人知识库</title>
  <meta name="description" content="按主题、时间和关系阅读个人知识库。">
  <meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#110c12">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23150e16'/%3E%3Cpath d='M9 9L23 12L16 24Z' stroke='%23ff526d' stroke-width='2' fill='none'/%3E%3Cg fill='%23ff526d'%3E%3Ccircle cx='9' cy='9' r='3'/%3E%3Ccircle cx='23' cy='12' r='3'/%3E%3Ccircle cx='16' cy='24' r='3'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="reviews.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="topbar">
    <button id="menu-btn" class="icon-button mobile-menu" aria-label="打开目录" aria-expanded="false"><span data-icon="menu"></span></button>
    <a class="brand" href="#home"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 9L25 13L16 26Z"/><circle cx="7" cy="9" r="3"/><circle cx="25" cy="13" r="3"/><circle cx="16" cy="26" r="3"/></svg><span>个人知识库<small>PERSONAL KNOWLEDGE</small></span></a>
    <button class="search-trigger" id="search-open"><span data-icon="search"></span><span class="search-label">搜索经历、人物、目标…</span><kbd>⌘ / Ctrl K</kbd></button>
    <div class="header-actions"><a href="/settings" class="graph-link" aria-label="资料管理与退出登录">管理</a><a href="#graph" class="graph-link"><span data-icon="network"></span><span>关系图谱</span></a><button class="icon-button" id="theme-btn" aria-label="切换浅色模式"><span data-icon="sun"></span></button><button class="icon-button" id="reading-btn" aria-label="切换阅读模式" aria-pressed="false"><span data-icon="book"></span></button></div>
  </header>
  <div id="nav-backdrop" hidden></div>
  <div class="layout">
    <aside id="sidebar" class="sidebar" aria-label="知识库目录"></aside>
    <main id="main" tabindex="-1"><p id="loading">正在读取你的知识库…</p></main>
    <aside id="context" class="context" aria-label="当前内容的关系与目录"></aside>
  </div>
  <dialog id="search-dialog" aria-labelledby="search-title">
    <form method="dialog" class="search-head"><span data-icon="search"></span><h2 id="search-title" class="sr-only">搜索知识库</h2><input id="search-input" type="search" placeholder="输入关键词，搜索全部个人记录" autocomplete="off" aria-label="搜索知识库"><button class="icon-button" value="close" aria-label="关闭搜索"><span data-icon="close"></span></button></form>
    <div id="search-summary" class="search-summary" aria-live="polite"></div><div id="search-results" class="search-results"></div>
    <div class="search-foot">记录与推断均保留原始标记<span>Esc 关闭</span></div>
  </dialog>
  <div id="notice" role="status" hidden></div>
  <script src="/bootstrap.js"></script>
</body>
</html>

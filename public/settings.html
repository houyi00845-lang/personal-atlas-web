<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>资料管理 · 个人知识库</title><link rel="stylesheet" href="/auth.css"></head><body class="settings-page"><main class="auth-card settings-card"><a href="/" class="wordmark">PERSONAL ATLAS<span>资料管理</span></a><h1>让记录留在自己的空间</h1><p>资料保存在私有存储中，公开代码仓库不会包含这些内容。</p><div class="row"><a href="/" class="button secondary">返回知识库 →</a><a href="/api/atlas" download="atlas-backup.json" class="button secondary">下载当前资料备份 ↓</a></div><section><h2>导入或更新资料</h2><p id="current-version">正在读取当前状态…</p><form id="import-form"><label for="atlas-file">选择知识库 JSON 文件</label><input id="atlas-file" type="file" accept="application/json,.json" required><p id="file-summary" class="hint">文件在你点击导入后才会上传。</p><button id="import-button" type="submit">保存到私有知识库 →</button></form></section><section><h2>最近的资料备份</h2><p class="hint">保留最近五次导入版本；知识库文件本身也会保留月度历史记录。</p><div id="versions"></div></section><section><details><summary>修改访问密码</summary><form id="password-form"><label for="old-password">当前密码</label><input id="old-password" type="password" autocomplete="current-password" required maxlength="256"><label for="new-password">新密码</label><input id="new-password" type="password" autocomplete="new-password" required minlength="14" maxlength="256"><label for="confirm-password">再次输入新密码</label><input id="confirm-password" type="password" autocomplete="new-password" required minlength="14" maxlength="256"><p class="hint">密码修改成功后，所有设备都会退出登录。</p><button type="submit">更新密码并退出登录 →</button></form></details><button id="logout-button" class="secondary" type="button">退出登录</button></section><p id="message" role="status" aria-live="polite"></p></main><script src="/settings.js"></script></body></html>
